name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v7

      # 第 2144 轮：tag 版本必须与代码里的 versionName 一致才放行。
      # v2.2.23 的教训：tag 打在 ec40633a 上，但那笔代码的 versionName
      # 还是 2.2.22，流水线原样构建、只改了文件名——装上"2.2.23"的
      # 电视里显示的还是 2.2.22，更新检查永远报有更新。老规矩是先提
      # 交升版、再打 tag（v2.2.21、v2.2.22 都是这么走的），这一步
      # 就是把老规矩钉死：对不上直接失败，不让错版包发出去。
      - name: 校验 tag 版本与代码版本号一致
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CODE_VERSION=$(sed -n 's/.*versionName = "\([0-9.]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::tag 是 v$TAG_VERSION，但代码里 versionName 是 $CODE_VERSION：先提交升版再打 tag"
            exit 1
          fi
          echo "tag 与代码版本号一致：$TAG_VERSION"

      - name: 构建Java环境
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 解码生成 jks
        run: echo $KEYSTORE_BASE64 | base64 -di > app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 生成apk
        run: chmod +x ./gradlew && ./gradlew assembleRelease

        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD}}

      - name: 获取版本号
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >>$GITHUB_OUTPUT

      - name: 重命名应用
        run: |
          for file in app/build/outputs/apk/release/app-*.apk; do
            if [[ $file =~ app-(.?*)release.apk ]]; then
              new_file_name="app/build/outputs/apk/release/mytv-android-${BASH_REMATCH[1]}${{ steps.version.outputs.version }}.apk"
              mv "$file" "$new_file_name"
            fi
          done

      - name: Prepare artifacts
        run: |
          mkdir artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          name: v${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: artifacts/*
