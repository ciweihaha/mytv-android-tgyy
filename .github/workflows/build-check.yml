name: Build Check

# Round 1: the repo ships only release.yml (tag-triggered, needs signing
# secrets the fork does not have), so pushes have no CI at all. This
# workflow builds the debug APK (no signing needed) on every push to main
# and on manual dispatch, so iteration rounds can be verified.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v7

      # Round 18: cache Gradle dependencies between runs. Without this every
      # run re-downloads the whole dependency set; setup-java's gradle cache
      # covers ~/.gradle/caches and ~/.gradle/wrapper (including the
      # distribution the retry step below downloads on a cold cache).
      - name: 构建Java环境
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      # Round 3: the Gradle distribution download (services.gradle.org) has
      # failed 4 consecutive runs with SocketTimeout / HTTP 504 while the
      # rest of the runner network works (Zulu JDK download OK). The wrapper
      # downloads the distribution on first use, so retry that step alone
      # instead of re-running the whole build; once downloaded it is cached
      # in ~/.gradle/wrapper/dists for the rest of the job.
      - name: 下载Gradle发行版（带重试）
        run: |
          chmod +x ./gradlew
          for i in 1 2 3 4 5; do
            ./gradlew --version && break || { echo "download attempt $i failed, retrying in 60s"; sleep 60; }
          done
          ./gradlew --version

      - name: 构建debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug
        timeout-minutes: 30

      # Round 9: run the unit tests (M3U/Tvbox/Git-release parsers). Kept as a
      # separate step so a test failure is visible without digging through the
      # build log.
      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest
        timeout-minutes: 30

      # Round 8: release builds run R8 (minifyEnabled + shrinkResources) but
      # debug builds do not, so proguard-rules.pro was never exercised. Build
      # release too, signed with a throwaway CI keystore, to validate the R8
      # rules on every push. The APK is verification-only and is NOT uploaded
      # (a per-run random key could never update an installed app).
      - name: 构建release APK（验证R8）
        run: |
          keytool -genkeypair -keystore /tmp/release.keystore -storepass android -alias release -keypass android -dname "CN=CI,O=CI,C=CN" -keyalg RSA -keysize 2048 -validity 1
          KEYSTORE=/tmp/release.keystore KEYSTORE_PASSWORD=android KEY_ALIAS=release KEY_PASSWORD=android ./gradlew assembleRelease
        timeout-minutes: 30

      - name: 上传debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mytv-android-debug
          path: app/build/outputs/apk/debug/*.apk

      # opt: 同样上传 release APK（同一把一次性密钥签名，仅供验证包
      # 体积与安装，无法覆盖已安装应用），这样包体积优化的效果可以
      # 直接用 release 产物衡量，而不只是看 debug 产物。
      - name: 上传release APK（仅供验证体积）
        uses: actions/upload-artifact@v7
        with:
          name: mytv-android-release-ci
          path: app/build/outputs/apk/release/*.apk
