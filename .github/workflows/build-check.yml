name: Build Check

# Round 1: the repo ships only release.yml (tag-triggered, needs signing
# secrets the fork does not have), so pushes have no CI at all. This
# workflow builds the debug APK (no signing needed) on every push to main
# and on manual dispatch, so iteration rounds can be verified.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: 构建debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: 上传debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mytv-android-debug
          path: app/build/outputs/apk/debug/*.apk
